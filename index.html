<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGPI Calculator 2.0 </title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .container {
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
        margin-bottom: 20px;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
      }
      .form-group select, .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #0056b3;
      }
      .result {
        margin-top: 20px;
        text-align: center;
        font-size: 18px;
        color: #333;
      }
      .tabs {
        display: flex;
        margin-bottom: 20px;
      }
      .tab {
        padding: 10px 20px;
        background-color: #ddd;
        cursor: pointer;
        border-radius: 5px 5px 0 0;
        margin-right: 5px;
      }
      .tab.active {
        background-color: #007bff;
        color: white;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('sgpi')">SGPI Calculator</div>
      <div class="tab" onclick="switchTab('cgpi')">CGPI Calculator</div>
    </div>

    <div class="container tab-content active" id="sgpi-tab">
      <h1>SGPI Calculator Sem II </h1>
      <form id="gradeForm">
        <div class="form-group">
          <label for="dm">DM</label>
          <select id="dm" class="score-select">
            <option value="">Select your score</option>
            <option value="30">AA (10)</option>
            <option value="27">AB (9)</option>
            <option value="24">BB (8)</option>
            <option value="21">BC (7)</option>
            <option value="18">CC (6)</option>
            <option value="15">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="daa">DAA</label>
          <select id="daa" class="score-select">
            <option value="">Select your score</option>
            <option value="30">AA (10)</option>
            <option value="27">AB (9)</option>
            <option value="24">BB (8)</option>
            <option value="21">BC (7)</option>
            <option value="18">CC (6)</option>
            <option value="15">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="msf">MSF-II</label>
          <select id="msf" class="score-select">
            <option value="">Select your score</option>
            <option value="40">AA (10)</option>
            <option value="36">AB (9)</option>
            <option value="32">BB (8)</option>
            <option value="28">BC (7)</option>
            <option value="24">CC (6)</option>
            <option value="20">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cc">CC/DW</label>
          <select id="cc" class="score-select">
            <option value="">Select your score</option>
            <option value="40">AA (10)</option>
            <option value="36">AB (9)</option>
            <option value="32">BB (8)</option>
            <option value="28">BC (7)</option>
            <option value="24">CC (6)</option>
            <option value="20">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sdp">SDP</label>
          <select id="sdp" class="score-select">
            <option value="">Select your score</option>
            <option value="30">AA (10)</option>
            <option value="27">AB (9)</option>
            <option value="24">BB (8)</option>
            <option value="21">BC (7)</option>
            <option value="18">CC (6)</option>
            <option value="15">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pcs">PCS</label>
          <select id="pcs" class="score-select">
            <option value="">Select your score</option>
            <option value="30">AA (10)</option>
            <option value="27">AB (9)</option>
            <option value="24">BB (8)</option>
            <option value="21">BC (7)</option>
            <option value="18">CC (6)</option>
            <option value="15">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="daa-lab">DAA Lab</label>
          <select id="daa-lab" class="score-select">
            <option value="">Select your score</option>
            <option value="10">AA (10)</option>
            <option value="9">AB (9)</option>
            <option value="8">BB (8)</option>
            <option value="7">BC (7)</option>
            <option value="6">CC (6)</option>
            <option value="5">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sdp-lab">SDP Lab</label>
          <select id="sdp-lab" class="score-select">
            <option value="">Select your score</option>
            <option value="10">AA (10)</option>
            <option value="9">AB (9)</option>
            <option value="8">BB (8)</option>
            <option value="7">BC (7)</option>
            <option value="6">CC (6)</option>
            <option value="5">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="jvp-lab">JVP Lab</label>
          <select id="jvp-lab" class="score-select">
            <option value="">Select your score</option>
            <option value="10">AA (10)</option>
            <option value="9">AB (9)</option>
            <option value="8">BB (8)</option>
            <option value="7">BC (7)</option>
            <option value="6">CC (6)</option>
            <option value="5">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <div class="form-group">
          <label for="miniproject">Mini Project II</label>
          <select id="miniproject" class="score-select">
            <option value="">Select your score</option>
            <option value="10">AA (10)</option>
            <option value="9">AB (9)</option>
            <option value="8">BB (8)</option>
            <option value="7">BC (7)</option>
            <option value="6">CC (6)</option>
            <option value="5">CD (5)</option>
            <option value="0">DD :(</option>
          </select>
        </div>
        <button type="button" onclick="calculateSGPI()">Calculate SGPI</button>
        <div class="result" id="sgpi-result"></div>
      </form>
    </div>

    <div class="container tab-content" id="cgpi-tab">
      <h1>CGPI Calculator</h1>
      <form id="cgpiForm">
        <div class="form-group">
          <label for="sem1">Semester 1 SGPI</label>
          <input type="number" id="sem1" step="0.01" min="0" max="10" placeholder="Enter your Semester 1 SGPI">
        </div>
        <div class="form-group">
          <label for="sem2">Semester 2 SGPI</label>
          <input type="number" id="sem2" step="0.01" min="0" max="10" placeholder="Enter your Semester 2 SGPI">
        </div>
        <button type="button" onclick="calculateCGPI()">Calculate CGPI</button>
        <div class="result" id="cgpi-result"></div>
      </form>
    </div>

    <div class="container">
      <hr />
      <hr />
      <h3>Hints</h3>
      <p>
        Make sure to select a grade for each subject to get the total score. 
        <br />
        This may not be accurate but I have tried to make it as close as
        possible to the actual grading system.
      </p>
    </div>

    <script>
      function calculateSGPI() {
        const scores = document.querySelectorAll(".score-select");
        let total = 0;
        let allSelected = true;

        scores.forEach((score) => {
          const value = parseInt(score.value);
          if (isNaN(value)) {
            allSelected = false;
          } else {
            total += value;
          }
        });

        const resultDiv = document.getElementById("sgpi-result");
        if (!allSelected) {
          resultDiv.textContent = "Please select a score for all subjects.";
          resultDiv.style.color = "red";
        } else {
          const sgpi = (total / 24).toFixed(4);
          resultDiv.textContent = `Current Semester SGPI: ${sgpi}`;
          resultDiv.style.color = "green";
          document.getElementById("current-sem").value = sgpi;
        }
      }

      function calculateCGPI() {
        const sem1 = parseFloat(document.getElementById("sem1").value);
        const sem2 = parseFloat(document.getElementById("sem2").value);
        
        
        if (isNaN(sem1) || isNaN(sem2) ) {
          document.getElementById("cgpi-result").textContent = "Please fill all fields (calculate current semester SGPI first).";
          document.getElementById("cgpi-result").style.color = "red";
          return;
        }

        const cgpi = (((sem1*22) + (sem2*24) ) / (22+24) ).toFixed(4);
        document.getElementById("cgpi-result").textContent = `Your CGPI: ${cgpi}`;
        document.getElementById("cgpi-result").style.color = "green";
      }

      function switchTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tab => {
          tab.classList.remove('active');
        });
        
        // Deactivate all tab buttons
        document.querySelectorAll('.tab').forEach(tab => {
          tab.classList.remove('active');
        });
        
        // Activate selected tab
        document.getElementById(`${tabName}-tab`).classList.add('active');
        
        // Activate selected tab button
        document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
      }
    </script>
  </body>
</html>
